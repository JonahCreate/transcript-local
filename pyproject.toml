[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "transcript-local"
version = "0.2.0a1"
description = "I Hate Transcription: local transcription and human review for Apple Silicon Macs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
  "faster-whisper==1.2.1", "huggingface-hub>=0.34,<1",
  "opencc-python-reimplemented==0.1.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "playwright>=1.64.1,<2",
]

[project.scripts]
transcript-local = "transcript_local.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
